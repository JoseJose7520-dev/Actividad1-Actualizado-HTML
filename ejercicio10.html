<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 10 - Conversor de Temperatura</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>
    <div class="contenedor">
        <h1>Conversor de Celsius a Fahrenheit</h1>

        <div class="grupo">
            <label for="celsius">Grados Celsius (°C):</label>
            <input type="text" id="celsius" placeholder="Ej. 25">

        <button type="button" onclick="convertir()">Convertir</button>

        <div class="grupo">
            <label for="fahrenheit">Grados Fahrenheit (°F):</label>
            <input type="text" id="fahrenheit" readonly placeholder="Resultado">
        </div>
    </div>

    <script src="js/ejercicio10.js"></script>
</body>
