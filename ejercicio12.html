<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12 - Conversor de Pesos a Dolares</title>
    <link rel="stylesheet" href="css/ejercicio12.css">
</head>
<body>
    <div class="contenedor">
        <h1>Conversor de Pesos (MXN) a Dolares (USD)</h1>

        <div class="grupo">
            <label for="mxn">Cantidad en pesos mexicanos:</label>
            <input type="text" id="mxn" placeholder="Ej. 500">
        </div>

        <button type="button" onclick="convertir()">Convertir</button>

        <div class="grupo">
            <label for="usd">Cantidad en dolares:</label>
            <input type="text" id="usd" readonly placeholder="Resultado">
        </div>
    </div>

    <script src="js/ejercicio12.js"></script>
</body>
</html>
